name: Daily Construction Radar

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  search-and-email:
    runs-on: ubuntu-latest
    env:
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    timeout-minutes: 10
    steps:
      - name: 📥 Скачать код
        uses: actions/checkout@v5

      - name: 🐍 Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 📦 Зависимости
        run: pip install requests beautifulsoup4 lxml feedparser openai

      - name: 🔍 Запустить радар и отправить письмо
        timeout-minutes: 6
        run: python main.py
